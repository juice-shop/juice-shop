<div class="assistant-widget">
  <section class="assistant-panel" *ngIf="isOpen()">
    <header class="assistant-panel__header">
      <div class="assistant-panel__title">
        <span class="assistant-panel__avatar">🍹</span>
        <div class="assistant-panel__title-text">
          <h3>Juice Shop AI</h3>
          <p>Ask about products, offers and pricing.</p>
        </div>
      </div>
      <button type="button" (click)="toggleWidget()" aria-label="Close assistant">✕</button>
    </header>

    <div class="assistant-panel__messages">
      <div *ngFor="let message of messages()" class="assistant-message" [class.assistant-message--user]="message.role === 'user'">
        <div class="assistant-message__bubble">
          <span class="assistant-message__tag">{{ message.role === 'user' ? 'You' : 'Assistant' }}</span>
          <p>{{ message.content }}</p>
        </div>
      </div>
      <div *ngIf="isLoading()" class="assistant-message assistant-message--loading">
        <div class="assistant-message__bubble">
          <span class="assistant-message__tag">Assistant</span>
          <p>Thinking…</p>
        </div>
      </div>
    </div>

    <form class="assistant-panel__form" (ngSubmit)="sendMessage()">
      <div class="assistant-input">
        <input
          [(ngModel)]="question"
          name="question"
          type="text"
          placeholder="Ask about product details, price or availability"
          autocomplete="off"
        />
        <button type="submit" aria-label="Send message">Send</button>
      </div>
    </form>
  </section>

  <button
    class="assistant-toggle"
    [class.assistant-toggle--open]="isOpen()"
    type="button"
    (click)="toggleWidget()"
    [attr.aria-label]="isOpen() ? 'Close AI assistant' : 'Open AI assistant'"
  >
    <span class="assistant-toggle__icon">{{ isOpen() ? '✕' : '💬' }}</span>
    <span class="assistant-toggle__label">Assistant</span>
  </button>
</div>
