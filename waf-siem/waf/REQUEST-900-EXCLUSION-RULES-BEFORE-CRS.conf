# =====================================================================
# Exclusiones ANTES del OWASP CRS  (Hito 3: ajuste de falsos positivos)
# =====================================================================
# Este archivo se monta en el WAF. Después de editarlo:
#     docker compose restart waf
#
# Reglas de oro:
#   1. Excluyan lo mínimo: una regla (id) para un parámetro en una ruta.
#      Nunca desactiven el CRS completo ni una familia entera de reglas.
#   2. Cada exclusión se documenta en el informe: ruta, regla, por qué es
#      un falso positivo y qué riesgo aceptan.
#   3. Usen IDs propios entre 10000 y 10999 (no chocan con el CRS).
#
# Cómo encontrar qué regla excluir: en Kibana abran el evento bloqueado
# (fuente: waf-audit) y lean modsec.transaction.messages.details.ruleId
# y el campo "data" (qué parámetro disparó la regla: "found within").
# El 949110 es el umbral que bloquea: no se excluye. La exclusión va
# sobre la regla que sumó puntos.
#
# Si el falso positivo no es uno de los ejemplos, no lo descomenten.
# Investiguen ese ruleId en el contenedor:
#   docker compose exec waf grep -n "id:942100" -R /etc/modsecurity.d/owasp-crs/rules
# y en https://coreruleset.org/docs/2-how-crs-works/2-3-false-positives-and-tuning/
# La guía del Equipo azul (sección Exclusiones) explica los cuatro tipos.
#
# ---------------------------------------------------------------------
# Tipo 1 (comentado): un campo, una regla, una ruta. El campo
# "descripcion" de reseñas permite texto libre y dispara 942100
# (SQLi por libinjection). Se quita SOLO ese parámetro de SOLO esa
# regla, SOLO en esa ruta. Cambien ruta, id, regla y campo por los
# de su evento. El id 10001 ya lo usa la exclusión de laboratorio.
#
# SecRule REQUEST_URI "@beginsWith /api/resenas" \
#     "id:10010,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=942100;ARGS:descripcion"
#
# Tipo 2 (comentado): una regla entera, solo en una ruta. Una carga
# legítima dispara 920420 porque su Content-Type no está en la lista
# del CRS. No hay un ARGS:campo que aislar. La ruta es exacta (@streq).
#
# SecRule REQUEST_URI "@streq /api/archivos/subir" \
#     "id:10011,phase:1,pass,nolog,\
#     ctl:ruleRemoveById=920420"
#
# Tipo 3: el mismo campo en todas las rutas. Va en RESPONSE-999, no aquí.
# Tipo 4: PUT, PATCH o DELETE legítimos (regla 911100). Se agregan en
# ALLOWED_METHODS del .env, no con una SecRule.
# ---------------------------------------------------------------------

# Sus exclusiones aquí:

# Falso positivo de laboratorio: curl/navegador contra http://127.0.0.1:8080
# (p. ej. HEAD /). La regla 920350 marca REQUEST_HEADERS:Host cuando el valor
# es una IP numérica (data: 127.0.0.1:8080). Se quita solo ese header de solo
# esa regla, y solo si el Host es loopback.
# Riesgo aceptado: un cliente que llegue con Host 127.0.0.1 no es evaluado
# por 920350. El resto del CRS sigue activo, también para otras IP en Host.
SecRule REQUEST_HEADERS:Host "@rx ^127\.0\.0\.1(?::\d+)?$" \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=920350;REQUEST_HEADERS:Host"