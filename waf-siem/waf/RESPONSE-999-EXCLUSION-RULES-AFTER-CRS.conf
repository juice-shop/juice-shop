# =====================================================================
# Exclusiones DESPUÉS del OWASP CRS
# =====================================================================
# Tipo 3: quitar un parámetro de una regla en TODAS las rutas
# (tiempo de configuración, después de cargar el CRS). Prefieran
# REQUEST-900, que limita la exclusión a una ruta. Este archivo solo
# cuando el mismo campo legítimo (un token, no un texto de usuario)
# dispara la misma regla en varias rutas. Después de editarlo:
#     docker compose restart waf
#
# Ejemplo (comentado): el token anti-CSRF de la app dispara 942440.
# El "!" saca ese blanco de la regla. Cambien el id y el campo por
# los de su evento (details.data, "found within").
#
# SecRuleUpdateTargetById 942440 "!ARGS:csrf_token"

