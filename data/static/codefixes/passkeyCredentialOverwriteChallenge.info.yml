fixes:
  - id: 1
    explanation: 'Scoping the uniqueness check to the current user (`UserId: user.id`) only prevents someone from registering the same credential twice on their own account. An attacker can still register a credential ID that belongs to a different user, which leaves the same credential ID stored for two accounts. A passkey login looks the account up by credential ID alone, so it is no longer certain whose account it ends up in.'
  - id: 2
    explanation: 'Replacing the existing entry instead of updating it keeps the attacker out of the victim''s account, but knowing a credential ID is still enough to act on someone else''s passkey: anyone can now delete it and lock the victim out of their passkey login. The duplicate must be rejected, not resolved in favour of the newcomer.'
  - id: 3
    explanation: 'Rejecting any credential ID that is already registered implements the WebAuthn §7.1.26 requirement ("credId is not yet registered for any user"). The colliding registration is refused, so a victim''s credential can no longer be overwritten, and no account ever ends up with two entries for the same credential ID.'
hints:
  - 'A credential ID must map to exactly one user. What does this handler do when the ID already exists?'
  - 'Check who currently owns a colliding credential ID before writing anything to the database.'
  - 'The WebAuthn spec (§7.1.26) requires that a credential ID is not already registered for any user. Enforce that across all accounts, not just the current one.'
