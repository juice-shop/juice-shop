fixes:
  - id: 1
    explanation: 'Rejecting assertions without a signature only checks that one is present, not that it is valid. An attacker simply sends a forged or tampered signature, and the session is still issued regardless of what the verification returned.'
  - id: 2
    explanation: "Requiring `userVerified` only confirms the authenticator performed a user gesture (PIN, biometric, ...). It says nothing about whether the signature over the challenge is valid, so a forged-signature assertion with the UV flag set still authenticates."
  - id: 3
    explanation: 'Gating the whole sign-in on `verification.verified` is the critical step: the cryptographic signature over the challenge and authenticator data must be valid before any session is issued. An assertion with a forged or tampered signature is now rejected.'
hints:
  - 'The WebAuthn library already tells you whether the signature is valid. Find where that answer is produced.'
  - 'Follow the `verification` result. Is the sign-in ever made conditional on it?'
  - 'The most security-critical step of passkey authentication is verifying the signature. Make sure no session is issued unless it succeeded.'
