fixes:
  - id: 1
    explanation: 'Scoping the uniqueness check to the current user (`UserId: user.id`) only prevents someone from registering the same credential twice on their own account. An attacker can still register a credential ID that belongs to a different user, so the account takeover remains possible.'
  - id: 2
    explanation: 'Upserting on a duplicate credential ID is exactly the problem: an attacker who supplies a victim''s credential ID overwrites the victim''s stored public key with their own. The duplicate must be rejected, not merged.'
  - id: 3
    explanation: 'Rejecting a credential ID that is already registered to any other user implements the WebAuthn §7.1.26 requirement ("credId is not yet registered for any user"). The colliding registration is refused, so a victim''s credential can no longer be overwritten.'
hints:
  - 'A credential ID must map to exactly one user. What does this handler do when the ID already exists?'
  - 'Check who currently owns a colliding credential ID before writing anything to the database.'
  - 'The WebAuthn spec (§7.1.26) requires that a credential ID is not already registered for any user. Enforce that across all accounts, not just the current one.'
