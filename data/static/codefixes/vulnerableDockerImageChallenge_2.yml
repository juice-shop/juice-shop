services:
  nginx:
    image: nginx:1.28.0-alpine
    container_name: juice-shop-proxy
    restart: unless-stopped
    cap_drop:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - juice-shop
    networks:
      - juice-shop-net

  juice-shop:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
    image: juice-shop:latest
    container_name: juice-shop-app
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    tmpfs:
      - /juice-shop/data/sqlite:rw,size=64m
    networks:
      - juice-shop-net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4.4-alpine
    container_name: juice-shop-redis
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "6379"
    networks:
      - juice-shop-net

  mongo:
    image: mongo:latest
    container_name: juice-shop-mongo
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MONGO_INITDB_DATABASE: juiceshop
    expose:
      - "27017"
    tmpfs:
      - /data/db:rw,size=64m
    networks:
      - juice-shop-net

volumes:
  juice-shop-data:
    driver: local
  mongo-data:
    driver: local

networks:
  juice-shop-net:
    driver: bridge
