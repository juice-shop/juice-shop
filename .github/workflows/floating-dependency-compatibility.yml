name: "Floating Dependency Compatibility"
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
env:
  NODE_VERSION: 24
  NPM_VERSION: 11.19.1
  JUICE_SHOP_FLOATING_DEPENDENCIES: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "Install current dependencies without lockfiles"
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm install --package-lock=false
      - name: "Run frontend and server unit tests"
        run: |
          npm run test:frontend
          npm run test:server
