name: Socket Security

on:
  # Primary: hit "Run workflow" in the Actions tab. No PR needed.
  workflow_dispatch:

  # Optional: also scan PRs. Remove this block if you only want manual runs.
  pull_request:
    types: [opened, synchronize]

# NOTE: issue_comment is deliberately NOT a trigger.
# socketsecurity 2.6.7 crashes with KeyError: 'ignore' on any comment event
# for a PR that has a Socket alerts comment but no @SocketSecurity ignore command.
# Add it back once that's patched.

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  socket-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reachability shells out to @coana-tech/cli via npx, so Node must be present.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Socket CLI
        run: pip install socketsecurity

      - name: Run Socket scan with reachability
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "${{ github.event.pull_request.number || 0 }}" \
            --reach \
            --reach-ecosystems npm

      # The reachability facts land here; grab them to inspect the raw output.
      - name: Upload reachability facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-facts
          path: .socket.facts.json
          if-no-files-found: warn
