
name: DevSecOps Juice Shop

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-check:
    name: Verify CI Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify installed tools
        run: |
          node --version
          npm --version
          git --version
          docker --version

      - name: Verify Juice Shop project
        run: |
          test -f package.json
          test -f Dockerfile
          test -f frontend/package.json
          echo "Juice Shop project verified!"
  
  build:
    name: Build Juice Shop
    runs-on: ubuntu-latest
    needs: environment-check

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Installation temporaire sans lockfile.
      # Le postinstall du dépôt lance lui-même
      # une installation frontend.
      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend and backend
        run: npm run build
  
  unit_tests:
    name: Unit Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run server unit tests
        run: npm run test:server
  
  frontend_tests:
    name: Frontend Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:frontend
  
  
  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  
  
  sca:
    name: SCA - Trivy Dependencies
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate backend dependency lockfile
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Generate frontend dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Verify dependency lockfiles
        run: |
          test -f package-lock.json
          test -f frontend/package-lock.json
          echo "Both npm lockfiles generated successfully"

     
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: error

      - name: Quality Gate - Trivy SCA
        run: |
          python3 security/check_sca_gate.py trivy-sca-report.json



    
  secrets_scan:
    name: Secrets Scan - TruffleHog
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
  
  docker_scan:
    name: Docker Image Scan - Trivy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:devsecops .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:devsecops'
          scanners: 'vuln'
          vuln-type: 'os,library'
          format: 'json'
          output: 'trivy-docker-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Docker scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json
          if-no-files-found: error
  
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:devsecops .

      - name: Create Docker test network
        run: docker network create zapnet

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop-dast \
            --network zapnet \
            -p 127.0.0.1:3000:3000 \
            juice-shop:devsecops

      - name: Wait for Juice Shop to start
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs juice-shop-dast
          exit 1

      - name: Prepare ZAP reports directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network zapnet \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop-dast:3000 \
            -m 1 \
            -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: zap-reports/
          if-no-files-found: warn

      - name: Stop Juice Shop
        if: always()
        run: |
          docker rm -f juice-shop-dast || true
          docker network rm zapnet || true
  
  iac_scan:
    name: IaC Security - Checkov
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Dockerfile and GitHub Actions
        run: |
          mkdir -p checkov-reports

          checkov -d . \
            --framework dockerfile github_actions \
            --output json \
            --output-file-path checkov-reports/checkov-report.json \
            --soft-fail

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-iac-report
          path: checkov-reports/
          if-no-files-found: error
  
  sbom:
    name: SBOM - Syft CycloneDX
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:devsecops .

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: juice-shop:devsecops
          format: cyclonedx-json
          output-file: juice-shop-sbom.cdx.json
          artifact-name: juice-shop-sbom
          upload-artifact: true

      - name: Verify SBOM generation
        run: |
          test -s juice-shop-sbom.cdx.json
          python3 -c "import json; d=json.load(open('juice-shop-sbom.cdx.json')); assert d['bomFormat']=='CycloneDX'; print('Components:', len(d.get('components', [])))"

