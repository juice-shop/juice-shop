
name: DevSecOps Juice Shop

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-check:
    name: Verify CI Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify installed tools
        run: |
          node --version
          npm --version
          git --version
          docker --version

      - name: Verify Juice Shop project
        run: |
          test -f package.json
          test -f Dockerfile
          test -f frontend/package.json
          echo "Juice Shop project verified!"
  
  build:
    name: Build Juice Shop
    runs-on: ubuntu-latest
    needs: environment-check

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Installation temporaire sans lockfile.
      # Le postinstall du dépôt lance lui-même
      # une installation frontend.
      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend and backend
        run: npm run build
  
  unit_tests:
    name: Unit Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run server unit tests
        run: npm run test:server
  
  frontend_tests:
    name: Frontend Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:frontend
  
  
  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  
  
  sca:
    name: SCA - Trivy Dependencies
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate backend dependency lockfile
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Generate frontend dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Verify dependency lockfiles
        run: |
          test -f package-lock.json
          test -f frontend/package-lock.json
          echo "Both npm lockfiles generated successfully"

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: error

    
  secrets_scan:
    name: Secrets Scan - TruffleHog
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
  
  docker_scan:
    name: Docker Image Scan - Trivy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:devsecops .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:devsecops'
          scanners: 'vuln'
          vuln-type: 'os,library'
          format: 'json'
          output: 'trivy-docker-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Docker scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json
          if-no-files-found: error

