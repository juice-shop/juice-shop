
name: DevSecOps Juice Shop

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-check:
    name: Verify CI Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify installed tools
        run: |
          node --version
          npm --version
          git --version
          docker --version

      - name: Verify Juice Shop project
        run: |
          test -f package.json
          test -f Dockerfile
          test -f frontend/package.json
          echo "Juice Shop project verified!"
  
  build:
    name: Build Juice Shop
    runs-on: ubuntu-latest
    needs: environment-check

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Installation temporaire sans lockfile.
      # Le postinstall du dÃ©pÃ´t lance lui-mÃªme
      # une installation frontend.
      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend and backend
        run: npm run build
  
  unit_tests:
    name: Unit Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run server unit tests
        run: npm run test:server
  
  frontend_tests:
    name: Frontend Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:frontend
  docker_build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: [unit_tests, frontend_tests]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop:devsecops .

      - name: Save Docker image
        run: docker save juice-shop:devsecops | gzip > juice-shop-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-docker-image
          path: juice-shop-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  
  
  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  
  
  sca:
    name: SCA - Trivy Dependencies
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate backend dependency lockfile
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Generate frontend dependency lockfile
        working-directory: frontend
        run: npm install --package-lock-only --package-lock=true --legacy-peer-deps --ignore-scripts

      - name: Verify dependency lockfiles
        run: |
          test -f package-lock.json
          test -f frontend/package-lock.json
          echo "Both npm lockfiles generated successfully"

     
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: error

      - name: Quality Gate - Trivy SCA
        run: |
          python3 security/check_sca_gate.py trivy-sca-report.json



    
  secrets_scan:
    name: Secrets Scan - TruffleHog
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history with TruffleHog
        uses: trufflesecurity/trufflehog@f8221ca52ac51bf66228d6ec3691f3ea0782ae15
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
  
  docker_scan:
    name: Docker Image Scan - Trivy
    runs-on: ubuntu-24.04
    needs: docker_build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:devsecops'
          scanners: 'vuln'
          vuln-type: 'os,library'
          format: 'json'
          output: 'trivy-docker-report.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Docker scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-docker-report.json
          if-no-files-found: error

      # NOUVEAU : Quality Gate Docker
      - name: Quality Gate - Trivy Docker
        run: python3 security/check_sca_gate.py trivy-docker-report.json

  
  
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-24.04
    needs: docker_build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Create Docker test network
        run: docker network create zapnet

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop-dast \
            --network zapnet \
            -p 127.0.0.1:3000:3000 \
            juice-shop:devsecops

      - name: Wait for Juice Shop to start
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs juice-shop-dast
          exit 1

      - name: Prepare ZAP reports directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network zapnet \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop-dast:3000 \
            -m 1 \
            -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: zap-reports/
          if-no-files-found: warn

      # NOUVEAU : Quality Gate DAST
      - name: Quality Gate - OWASP ZAP
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("zap-reports/zap-report.json")

          if not path.is_file():
              sys.exit("QUALITY GATE ERROR: rapport ZAP absent")

          try:
              with path.open(encoding="utf-8") as f:
                  report = json.load(f)
          except (OSError, ValueError) as error:
              sys.exit(f"QUALITY GATE ERROR: {error}")

          if not isinstance(report, dict) or not isinstance(report.get("site"), list) or not report["site"]:
              sys.exit("QUALITY GATE ERROR: aucun site analyse")

          high = [
              alert
              for site in report["site"]
              for alert in site.get("alerts", [])
              if str(alert.get("riskcode")) == "3"
          ]

          print("Alertes HIGH :", len(high))

          for alert in high:
              print("BLOCKED:", alert.get("name"))

          if high:
              sys.exit("QUALITY GATE FAILED")

          print("QUALITY GATE PASSED")
          PY

      - name: Stop Juice Shop
        if: always()
        run: |
          docker rm -f juice-shop-dast || true
          docker network rm zapnet || true

  iac_scan:
    name: IaC Security - Checkov
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Dockerfile and GitHub Actions
        run: |
          mkdir -p checkov-reports

          checkov -d . \
            --framework dockerfile github_actions \
            --output json \
            --output-file-path checkov-reports/checkov-report.json \
            --soft-fail

      - name: Quality Gate - Checkov IaC
        run: python3 security/check_checkov_gate.py

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-iac-report
          path: checkov-reports/
          if-no-files-found: error

  sbom:
    name: SBOM - Syft CycloneDX
    runs-on: ubuntu-24.04
    needs: docker_build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: juice-shop:devsecops
          format: cyclonedx-json
          output-file: juice-shop-sbom.cdx.json
          artifact-name: juice-shop-sbom
          upload-artifact: true


      - name: Quality Gate - SBOM
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("juice-shop-sbom.cdx.json", encoding="utf-8") as f:
              sbom = json.load(f)

          components = sbom.get("components", [])

          # Les fichiers peuvent lÃ©gitimement ne pas avoir de version.
          invalid = [
              c for c in components
              if not c.get("name")
              or (c.get("type") == "library" and not c.get("version"))
          ]

          print("Format:", sbom.get("bomFormat"))
          print("Components:", len(components))
          print("Invalid components:", len(invalid))

          if sbom.get("bomFormat") != "CycloneDX":
              sys.exit("QUALITY GATE FAILED: invalid SBOM format")

          if sbom.get("specVersion") != "1.6":
              sys.exit("QUALITY GATE FAILED: unexpected CycloneDX version")

          if not components:
              sys.exit("QUALITY GATE FAILED: empty SBOM")

          if invalid:
              sys.exit("QUALITY GATE FAILED: invalid component metadata")

          print("QUALITY GATE PASSED")
          PY
  publish_image:
    name: Publish Docker Image to Docker Hub
    runs-on: ubuntu-24.04
    needs:
      - docker_build
      - sast
      - sca
      - secrets_scan
      - docker_scan
      - dast
      - iac_scan
      - sbom

    steps:
      - name: Download validated Docker image
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-docker-image

      - name: Load Docker image
        run: gunzip -c juice-shop-image.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push validated image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/juice-shop-devsecops:${GITHUB_SHA}"

          docker tag juice-shop:devsecops "$IMAGE"
          docker push "$IMAGE"

          echo "Published: $IMAGE"
