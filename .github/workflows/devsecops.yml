name: "DevSecOps Pipeline - IE3142"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE_NAME: ie3142-juice-shop

jobs:
  #GATE 2 - Dependency / SCA: npm audit (Managed by IT24100258)
  dependency-scan:
    name: "Gate 2 - Dependency / SCA: npm audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Install dependencies"
        run: npm install --omit=dev --ignore-scripts

      - name: "Run npm audit (generate JSON report)"
        run: npm audit --audit-level=high --omit=dev || true
        continue-on-error: false

      - name: "Save full audit report as artifact"
        if: always()
        run: npm audit --json --omit=dev > npm-audit-report.json || true

      - name: "Upload audit report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

# Build Docker with runner swap space
  build-docker:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Add swap space (required for Juice Shop npm install)"
        run: |
          set -euo pipefail
          SWAPFILE=/mnt/juice-shop.swap
          if sudo swapon --show=NAME | grep -Fxq "$SWAPFILE"; then
            echo "$SWAPFILE already active"
          else
            if sudo test -e "$SWAPFILE"; then
              sudo swapoff "$SWAPFILE" 2>/dev/null || true
              sudo rm -f "$SWAPFILE"
            fi
            sudo fallocate -l 6G "$SWAPFILE" || \
              sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=6144 status=progress
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          echo "Memory after swap:"
          free -h
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Build image from Dockerfile"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
      - name: "Upload image tarball"
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

# GATE 4 — Container image scanning: Trivy (Managed by IT24100258)
  container-scan:
    name: "Gate 4 · Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: "Checkout repository (for .trivyignore)"
        uses: actions/checkout@v4

      - name: "Download image tarball"
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: "Load Docker image"
        run: docker load --input /tmp/image.tar

      - name: "Run Trivy scan — fail on CRITICAL (applying .trivyignore)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          trivyignores: ".trivyignore"
        continue-on-error: false

      - name: "Run Trivy scan — SARIF report (all severities)"
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore"

      - name: "Upload Trivy SARIF results"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

# SUMMARY — Final status evaluation
  pipeline-status:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan]
    if: always()
    steps:
      - name: "Check gate status"
        run: |
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Container Scan:  ${{ needs.container-scan.result }}"