name: DevSecOps Pipeline (Preentrega)

on:
  pull_request:
    branches: [ master]
  push:
    branches: [ master ]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (SARIF)
        run: semgrep scan --config p/default --sarif-output=semgrep.sarif
        
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Guardar SARIF como artefacto
        uses: actions/upload-artifact@v4
        with:
            name: semgrep-sarif
            path: semgrep.sarif
        if: always()
      - name: Gate SAST (bloquea si hay hallazgos ERROR)
        run: semgrep scan --config p/default --severity ERROR --error

  sca:
      name: SCA - SBOM & Vulnerabilidades
      runs-on: ubuntu-latest
      permissions:
        contents: read
        security-events: write
      steps:
        - uses: actions/checkout@v4
        
        
        - name: Generate SBOM (CycloneDX) with Syft
          uses: anchore/sbom-action@v0
          with:
            path: .
            format: cyclonedx-json
            output-file: security/sbom/sbom.cdx.json
            
        - name: Scan with Grype
          uses: anchore/scan-action@v7.4.2
          with:
            path: "."                 
            fail-build: true
            severity-cutoff: high
          env:
            GRYPE_DB_AUTO_UPDATE: "true"  
            

        - name: Upload SBOM as artifact
          uses: actions/upload-artifact@v4
          with:
            name: sbom-cyclonedx
            path: security/sbom/sbom.cdx.json
