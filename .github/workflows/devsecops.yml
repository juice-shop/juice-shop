
name: DevSecOps Juice Shop

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-check:
    name: Verify CI Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify installed tools
        run: |
          node --version
          npm --version
          git --version
          docker --version

      - name: Verify Juice Shop project
        run: |
          test -f package.json
          test -f Dockerfile
          test -f frontend/package.json
          echo "Juice Shop project verified!"
  
  build:
    name: Build Juice Shop
    runs-on: ubuntu-latest
    needs: environment-check

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Installation temporaire sans lockfile.
      # Le postinstall du dépôt lance lui-même
      # une installation frontend.
      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend and backend
        run: npm run build
  
  unit_tests:
    name: Unit Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run server unit tests
        run: npm run test:server
  
  frontend_tests:
    name: Frontend Tests - Juice Shop
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:frontend
