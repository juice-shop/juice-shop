
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: semgrep
        name: Semgrep SAST
        entry: semgrep scan --config p/security-audit --error --skip-unknown-extensions
        language: system
        types_or: [javascript, jsx, ts, tsx]
        require_serial: true
      - id: eslint
        name: ESLint Security
        entry: cmd /c node_modules\\.bin\\eslint.cmd
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
