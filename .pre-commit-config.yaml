
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: semgrep
        name: Semgrep SAST
        entry: semgrep scan --config p/security-audit --error --skip-unknown-extensions
        language: system
        types_or: [javascript, jsx, ts, tsx]
